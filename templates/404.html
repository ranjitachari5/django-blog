<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb;
    --ink: #2b2f45;
    --muted: #6b7088;
    --accent: #5b5fc7;
    --accent-dark: #4a4eb3;
    --line: #d9dcea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 24px;
  }
  main { text-align: center; max-width: 440px; }

  .ghost-wrap { position: relative; width: 120px; margin: 0 auto 8px; }
  .ghost { width: 100%; display: block; animation: float 3.2s ease-in-out infinite; }
  .shadow {
    width: 70px; height: 8px; margin: 10px auto 0;
    background: var(--line); border-radius: 50%;
    animation: shadow 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.75); opacity: .6; } }
  .blink { transform-origin: center; transform-box: fill-box; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  .code {
    font-size: clamp(64px, 16vw, 96px);
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--accent);
    line-height: 1;
    margin-top: 20px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-top: 12px; }
  p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 10px auto 0; }

  .home-btn {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 28px; padding: 12px 26px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--accent);
    text-decoration: none; border-radius: 999px;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    box-shadow: 0 4px 12px rgba(91, 95, 199, .25);
  }
  .home-btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(91, 95, 199, .3); }
  .home-btn:active { transform: translateY(0); }
  .home-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .home-btn .arrow { transition: transform .2s ease; }
  .home-btn:hover .arrow { transform: translateX(-3px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main>
    <div class="ghost-wrap" aria-hidden="true">
      <svg class="ghost" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 64 C14 28 36 10 60 10 C84 10 106 28 106 64 L106 112
                 C106 120 101 122 96 119 C91 116 88 116 83 120
                 C78 124 74 124 69 120 C64 116 60 116 55 120
                 C50 124 46 124 41 120 C36 116 32 116 27 119
                 C22 122 14 122 14 112 Z"
              fill="#ffffff" stroke="#c4c8de" stroke-width="3" stroke-linejoin="round"/>
        <g class="blink">
          <circle cx="44" cy="58" r="6" fill="#2b2f45"/>
          <circle cx="76" cy="58" r="6" fill="#2b2f45"/>
        </g>
        <ellipse cx="34" cy="76" rx="7" ry="4.5" fill="#f4b8c8" opacity=".6"/>
        <ellipse cx="86" cy="76" rx="7" ry="4.5" fill="#f4b8c8" opacity=".6"/>
        <ellipse cx="60" cy="78" rx="4" ry="5" fill="#2b2f45"/>
      </svg>
      <div class="shadow"></div>
    </div>

    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>Looks like this page drifted away. It may have moved, or the link might be incorrect.</p>

    <a class="home-btn" href="/"><span class="arrow">←</span> Back to Home</a>
  </main>

<script>
  // Eyes gently follow the pointer
  (function () {
    var eyes = document.querySelectorAll('.blink circle');
    var svg = document.querySelector('.ghost');
    if (!svg || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var base = [[44, 58], [76, 58]];
    window.addEventListener('pointermove', function (e) {
      var r = svg.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height * 0.45);
      var d = Math.hypot(dx, dy) || 1;
      var m = Math.min(4, d / 40);
      eyes.forEach(function (el, i) {
        el.setAttribute('cx', base[i][0] + (dx / d) * m);
        el.setAttribute('cy', base[i][1] + (dy / d) * m);
      });
    });
  })();
</script>
</body>
</html>
