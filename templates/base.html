{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Django Blogs</title>

    <link
      href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link href="{% static 'css/blog_home.css' %}" rel="stylesheet" />
    <style>
      .page-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page-wrapper > .container {
        flex: 1;
      }
      .blog-footer {
        background: #202633;
        color: #c9ced8;
        padding: 28px 0;
        margin-top: 40px;
        border-top: 4px solid #ffc107;
      }

      .footer-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }

      .footer-brand {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
      }

      .footer-links {
        display: flex;
        gap: 20px;
      }

      .footer-links a {
        color: #c9ced8;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
      }

      .footer-links a:hover {
        color: #ffc107;
      }

      .footer-copy {
        margin: 0;
        font-size: 0.82rem;
        color: #8b93a1;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="blog-header py-3">
        <div class="row d-flex justify-content-between align-items-center">
          <!-- Logo -->
          <div class="col-5 pt-1">
            <a class="blog-header-logo text-dark mb-2" href="/">
              Django Blog
            </a>
          </div>

          <!-- Search -->
          <div
            class="col-md-4 d-flex md-justify-content-center md-align-items-center"
          >
            <form action="{% url 'search' %}" method="get" class="search-form">
              <input
                type="text"
                name="keyword"
                placeholder="Search..."
                value="{{keyword}}"
                class="search-input"
              />
              <button type="submit" class="search-btn bg-warning">Go</button>
            </form>
          </div>
          {%if not user.is_authenticated%}
          <!-- Login / Register -->
          <div
            class="col-md-3 d-flex md-d-flex md-justify-content-end justify-content-end align-items-center"
          >
            <a
              class="btn btn-sm btn-outline-secondary"
              href="{%url 'register' %}"
            >
              Register
            </a>

            &nbsp;
            <a class="btn btn-sm btn-warning" href="{%url 'login' %}">
              Login
            </a>
          </div>
          {%else%}
          <div
            class="col-md-3 d-flex md-d-flex md-justify-content-end justify-content-end align-items-center"
          >
            <p class="font-family:sans-serif">
              <a class="btn btn-sm btn-cool" href="{%url 'dashboard' %}"
                >Dashboard
              </a>
              <a class="btn btn-sm btn-cool" href="{%url 'logout' %}">
                Log out
              </a>
            </p>
          </div>
          {%endif%}
        </div>
      </header>

      <!-- Categories -->
      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for category in categories %}
          <a class="p-2 text-muted" href="{% url 'category' category.id %}">
            {{ category }}
          </a>
          {% endfor %}
        </nav>
      </div>

      <!-- Main Content -->
      {% block content %} {% endblock %}

      <!-- Footer -->
    </div>
    <footer class="blog-footer">
      <div class="container footer-inner">
        <nav class="footer-links">
          <a href="{% url 'home' %}">Home</a>
          <a href="https://www.linkedin.com/in/ranjit-kumar-a-3a7785335/" target="_blank">Contact</a>
        </nav>
        <p class="footer-copy">&copy; 2026 Django Blog. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
