{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Django Blogs</title>

    <link
      href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
      rel="stylesheet"
    />

    <link href="{% static 'css/blog_home.css' %}" rel="stylesheet" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="blog-header py-3">
        <div class="row d-flex justify-content-between align-items-center">
          <!-- Logo -->
          <div class="col-5 pt-1">
            <a class="blog-header-logo text-dark" href="/"> Django Blog </a>
          </div>

          <!-- Search -->
          <div class="col-4 d-flex justify-content-center align-items-center">
            <form action="{% url 'search' %}" method="get" class="search-form">
              <input
                type="text"
                name="keyword"
                placeholder="Search..."
                class="search-input"
              />
              <button type="submit" class="search-btn bg-warning">Go</button>
            </form>
          </div>

          <!-- Login / Register -->
          <div class="col-3 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-warning" href="#"> Login </a>

            &nbsp;

            <a class="btn btn-sm btn-outline-secondary" href="#"> Register </a>
          </div>
        </div>
      </header>

      <!-- Categories -->
      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for category in categories %}
          <a class="p-2 text-muted" href="{% url 'category' category.id %}">
            {{ category }}
          </a>
          {% endfor %}
        </nav>
      </div>

      <!-- Main Content -->
      {% block content %} {% endblock %}

      <!-- Footer -->
      <footer class="blog-footer">
        <p>
          Django blog built with ❤️ by
          <a href="#">Ranjit Kumar A</a>
        </p>
      </footer>
    </div>
  </body>
</html>
