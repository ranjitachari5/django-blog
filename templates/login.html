<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Your Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #F2B01E;
    --accent-dark: #C98F00;
    --text: #1f1d18;
    --muted: #6f6a5c;
    --border: #dfd9c6;
    --error: #b3261e;
    /* Swap this URL for your own image any time */
    --hero-image: url("https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1400&q=80");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    background: #fff;
  }

  /* ---------- Image panel ---------- */
  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 44px 52px;
    color: #fff;
    background-color: #3a2c05;
    background-image:
      linear-gradient(180deg, rgba(25,18,2,.55) 0%, rgba(25,18,2,.35) 45%, rgba(25,18,2,.8) 100%),
      var(--hero-image);
    background-size: cover;
    background-position: center;
  }
  .hero::after {
    content: "";
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 5px;
    background: var(--accent);
  }
  .hero .logo {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    letter-spacing: .2px;
  }
  .hero .logo span { color: var(--accent); }
  .hero h2 {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    line-height: 1.15;
    font-weight: 700;
    max-width: 440px;
    margin-bottom: 14px;
  }
  .hero p { max-width: 420px; line-height: 1.65; color: rgba(255,255,255,.85); }
  .hero small { display: block; margin-top: 28px; color: rgba(255,255,255,.6); font-size: 13px; }

  /* ---------- Form panel ---------- */
  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background: #FFFCF2;
  }
  .form-wrap { width: 100%; max-width: 380px; }
  h1 { font-family: 'Playfair Display', serif; font-size: 30px; margin-bottom: 6px; }
  .sub { color: var(--muted); margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(242,176,30,.25);
  }
  .field.invalid input { border-color: var(--error); }
  .error { display: none; color: var(--error); font-size: 13px; margin-top: 5px; }
  .field.invalid .error { display: block; }
  .alert {
    background: #fdecea;
    border: 1px solid #f3c3bf;
    color: var(--error);
    font-size: 14px;
    padding: 10px 13px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 62px; }
  .show {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: auto; margin: 0; padding: 6px 8px;
    background: none; border: none; box-shadow: none;
    font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    cursor: pointer;
  }
  .show:hover { color: var(--text); }

  .submit {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .submit:hover { background: var(--accent-dark); }

  .footer { margin-top: 22px; text-align: center; color: var(--muted); }
  .footer a { color: var(--accent-dark); font-weight: 500; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    .hero { padding: 28px 24px; min-height: 220px; }
    .hero::after { top: auto; left: 0; width: auto; height: 5px; }
    .hero h2 { font-size: 26px; margin-bottom: 0; }
    .hero p, .hero small { display: none; }
  }
</style>
</head>
<body>
  <aside class="hero">
    <a class="logo" href="{% url 'home' %}">Django<span>Blog</span></a>
    <div>
      <h2>Welcome back.</h2>
      <p>Sign in to pick up where you left off, read your saved posts and join the conversation.</p>
      <small>© 2026 DjangoBlog</small>
    </div>
  </aside>

  <main class="panel">
    <div class="form-wrap">
      <h1>Sign in</h1>
      <p class="sub">Enter your details to access your account.</p>

      <form id="form" action="{% url 'login' %}" method="post" novalidate>
        {% csrf_token %}
        {{form.as_p}}
        <!-- {% if form.non_field_errors %}
          <div class="alert">{{ form.non_field_errors.0 }}</div>
        {% endif %}

        <div class="field {% if form.username.errors %}invalid{% endif %}">
          <label for="id_username">Username</label>
          <input type="text" id="id_username" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus>
          <div class="error">{{ form.username.errors.0|default:"Please enter your username." }}</div>
        </div>

        <div class="field {% if form.password.errors %}invalid{% endif %}">
          <label for="id_password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="id_password" name="password" autocomplete="current-password">
            <button type="button" class="show" id="show">Show</button>
          </div>
          <div class="error">{{ form.password.errors.0|default:"Please enter your password." }}</div>
        </div>

        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %} -->

        <button type="submit" class="submit">Sign in</button>
      </form>

      <p class="footer">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
      <p class="footer"><a href="{% url 'home' %}">Continue without an account -></a></p>
    </div>
  </main>

<script>
  const form = document.getElementById('form');
  const pw = document.getElementById('id_password');
  const showBtn = document.getElementById('show');

  showBtn.addEventListener('click', () => {
    const hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    showBtn.textContent = hidden ? 'Hide' : 'Show';
  });

  const checks = {
    id_username: el => el.value.trim().length > 0,
    id_password: el => el.value.length > 0
  };

  form.addEventListener('submit', e => {
    let valid = true;
    for (const id in checks) {
      const el = document.getElementById(id);
      const ok = checks[id](el);
      el.closest('.field').classList.toggle('invalid', !ok);
      if (!ok) valid = false;
    }
    if (!valid) e.preventDefault();
  });
</script>
</body>
</html>
