<div class="col-md-3">
  <div class="nav flex-column nav-pills bg-light" aria-orientation="vertical">
    {% url 'dashboard' as dashboard_url %}

    {% if user.is_superuser or perms.auth.view_user %}
    <a href="{{ dashboard_url }}"
       class="nav-link text-dark {% if request.path == dashboard_url %}bg-warning{% endif %}">Dashboard</a>
    {% endif %}

    {% if perms.auth.view_user %}
    <a href="{% url 'users' %}"
       class="nav-link text-dark {% if 'users' in request.path %}bg-warning{% endif %}">Users</a>
    {% endif %}

    {% if perms.blogs.change_category %}
    <a href="{% url 'categories' %}"
       class="nav-link text-dark {% if 'categories' in request.path %}bg-warning{% endif %}">Categories</a>
    {% endif %}

    {% if perms.blogs.view_blog %}
    <a href="{% url 'posts' %}"
       class="nav-link text-dark {% if 'posts' in request.path %}bg-warning{% endif %}">Posts</a>
    {% endif %}

    <a href="{% url 'logout' %}" class="nav-link text-dark">Logout</a>
  </div>
</div>
